<!doctype html>
<!--
  The chat page's structure. Look and behavior live in separate files:
    css/styles.css        how it looks
    js/main.js            what happens when you type and send (start here)
  Messages are added to #thread by JavaScript as the conversation goes.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orchestrator Chat</title>
  <link rel="stylesheet" href="/static/css/styles.css">

  <!-- Third-party libraries, bundled locally (no internet needed):
       marked turns Markdown into HTML; DOMPurify removes anything unsafe from it. -->
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>

  <!-- Our code. type="module" lets the JS files import from each other. -->
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">O</div>
      Orchestrator
      <small id="modelName">LangChain · streaming</small>
    </div>
    <button class="ghost-btn" id="newChat" type="button">New chat</button>
  </header>

  <main id="scroller">
    <div class="thread" id="thread">
      <!-- Shown until the first message is sent. -->
      <div class="empty" id="empty">
        <h1>What can I help with?</h1>
        <p>Math questions go to a calculator tool. Everything else goes to the general model.</p>
        <div class="suggestions">
          <button class="suggestion" type="button" data-query="If I buy 3 boxes of 12 cookies and eat 5, how many are left?">
            <span class="suggestion-label">Math</span>If I buy 3 boxes of 12 cookies and eat 5, how many are left?
          </button>
          <button class="suggestion" type="button" data-query="Explain what an API is in two sentences.">
            <span class="suggestion-label">General</span>Explain what an API is in two sentences.
          </button>
          <button class="suggestion" type="button" data-query="What is the square root of pi? Explain it.">
            <span class="suggestion-label">Math</span>What is the square root of pi? Explain it.
          </button>
          <button class="suggestion" type="button" data-query="Give me 3 tips for writing clean Python.">
            <span class="suggestion-label">General</span>Give me 3 tips for writing clean Python.
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Ask anything…" autofocus></textarea>
      <button class="send" id="send" type="submit" aria-label="Send" disabled></button>
    </form>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </footer>
</body>
</html>
